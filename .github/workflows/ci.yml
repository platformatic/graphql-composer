---
name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x, 26.x]
        os: [ubuntu-latest, windows-latest]
        graphql-version: [16, 17]
        pino-version: [10]
        include:
          - node-version: 24.x
            os: ubuntu-latest
            graphql-version: 16
            pino-version: 9
    name: "Node.js ${{ matrix.node-version }} - graphql ${{ matrix.graphql-version }} - pino ${{ matrix.pino-version }}"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use supported Node.js Version
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Restore cached dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('package-lock.json', 'package.json') }}
      - name: Install dependencies
        run: npm install --no-save graphql@${{ matrix.graphql-version }} pino@${{ matrix.pino-version }}
      - name: Run Tests
        run: npm test
